version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /backend
      - /backend/download_service
      - /backend/generation_orchestrator
      - /backend/policy_service
      - /backend/status_service
      - /backend/validation_service
      - /agents
      - /ml
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
