name: Security

# P1 + P2: IaC scanning, IAM validation, SAST, dependency/container scanning,
# secret scanning. Every scanner uploads SARIF to GitHub code scanning, then a
# separate step enforces the severity gate so findings are visible even when
# the gate fails.
#
# Severity gates
#   Checkov     : hard-fail list of HIGH checks in .checkov.yaml
#   IAM         : any wildcard action/resource, or Access Analyzer ERROR/SECURITY_WARNING
#   Semgrep     : any ERROR-severity finding
#   Trivy       : HIGH/CRITICAL with a fix available (deps + container image)
#   pip-audit   : any known vulnerability (accepted ones listed in .security/pip-audit-ignore.txt)
#   npm audit   : high or critical in production deps
#   gitleaks    : any secret
#
# Note: SARIF upload to code scanning is free on public repos; private repos
# need GitHub Advanced Security, so the upload step is continue-on-error and
# the SARIF files are also kept as workflow artifacts.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── P1: Terraform / IaC ─────────────────────────────────────────────────────
  checkov:
    name: Checkov (Terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "checkov==3.2.*"
      - name: Scan infra/ (report everything, hard-fail on HIGH list)
        id: scan
        run: checkov --config-file .checkov.yaml -o cli -o sarif --output-file-path console,checkov-results
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-sarif
          path: checkov-results/

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  iam-policies:
    name: IAM least-privilege + Access Analyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS for Access Analyzer (optional)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: Local wildcard gate (no AWS needed)
        run: python scripts/validate_iam_policies.py
      # Access Analyzer's ValidatePolicy is free but is an AWS API call. Set the
      # repo variable AWS_SECURITY_ROLE_ARN (role trusted for GitHub OIDC with
      # access-analyzer:ValidatePolicy) to enable it.
      - name: Configure AWS (OIDC)
        if: vars.AWS_SECURITY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SECURITY_ROLE_ARN }}
          aws-region: us-east-1
      - name: IAM Access Analyzer validate-policy
        if: vars.AWS_SECURITY_ROLE_ARN != ''
        run: python scripts/validate_iam_policies.py --access-analyzer --json iam-report.json
      - uses: actions/upload-artifact@v4
        if: always() && vars.AWS_SECURITY_ROLE_ARN != ''
        with:
          name: iam-report
          path: iam-report.json

  # ── P2: SAST ────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          semgrep scan \
            --config p/python --config p/javascript --config p/react \
            --config p/terraform --config p/dockerfile --config p/github-actions \
            --config .semgrep.yml \
            --metrics off \
            --sarif-output=semgrep.sarif --json-output=semgrep.json
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gate on ERROR severity
        run: |
          python3 - <<'EOF'
          import json, sys
          res = json.load(open("semgrep.json"))["results"]
          errs = [r for r in res if r["extra"]["severity"] == "ERROR"]
          for r in errs:
              print(f"{r['path']}:{r['start']['line']} {r['check_id']}")
          print(f"{len(res)} findings, {len(errs)} ERROR")
          sys.exit(1 if errs else 0)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.*

  # ── P2: dependencies + container image ──────────────────────────────────────
  trivy:
    name: Trivy (deps + image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency scan (SARIF, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
      - name: Upload deps SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Build orchestrator image
        run: docker build -f backend/Dockerfile -t policycraft-orchestrator:${{ github.sha }} .
      - name: Image scan (SARIF, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: policycraft-orchestrator:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
      - name: Upload image SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Gate - deps HIGH/CRITICAL with fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Gate - image HIGH/CRITICAL with fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: policycraft-orchestrator:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy
          path: trivy-*.sarif

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pip-audit==2.7.*"
      - name: Audit every requirements file
        run: |
          IGNORES=$(grep -v '^\s*#' .security/pip-audit-ignore.txt | awk 'NF{print "--ignore-vuln " $1}' | xargs)
          status=0
          for f in $(git ls-files '*requirements*.txt'); do
            echo "::group::$f"
            pip-audit -r "$f" --desc on --format json -o "pip-audit-$(echo $f | tr '/' '_').json" $IGNORES || status=1
            pip-audit -r "$f" --desc off $IGNORES || true
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: pip-audit-*.json

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: frontend/npm-audit.json

  # ── P2: secrets ─────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history
      - name: Scan git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml \
            --report-format sarif --report-path /repo/gitleaks.sarif --redact --exit-code 1
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
